<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Novva · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#091120; --bg2:#0C1626; --card:#111F36; --card2:#16294682; --line:#213656;
    --ink:#EAF1FB; --muted:#8DA2C0;
    --cyan:#38BDF8; --teal:#2DD4BF; --violet:#A78BFA; --amber:#FBBF24; --rose:#FB7185; --green:#34D399;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.5; padding-bottom:46px; transition:background-color .35s ease, color .3s ease;
    background-image:radial-gradient(90% 45% at 15% 0%, rgba(76,141,255,.13), transparent 60%),
                     radial-gradient(75% 40% at 88% 3%, rgba(155,125,255,.12), transparent 55%),
                     radial-gradient(70% 38% at 62% 100%, rgba(245,139,176,.07), transparent 60%)}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px}
  h1,h2,h3,.num,.brand,.logo,.price,.total{font-family:"Fraunces",Georgia,serif}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .hidden{display:none !important}
  @keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
  .fade{animation:fade .35s ease both}

  #login{min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; text-align:center}
  #login .logo{font-weight:700; font-size:40px; letter-spacing:-.02em; background:linear-gradient(120deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  #login .tag{color:var(--muted); margin:6px 0 30px; font-size:15px}
  #login input{width:100%; max-width:300px; padding:15px 16px; border:1.5px solid var(--line); border-radius:13px; font-size:16px; font-family:inherit; text-align:center; background:var(--card); color:var(--ink)}
  #login input::placeholder{color:var(--muted)}
  #login input:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 0 4px rgba(56,189,248,.15)}
  #login button{width:100%; max-width:300px; margin-top:12px; padding:15px; border:none; border-radius:13px; background:linear-gradient(120deg,var(--cyan),#2563EB); color:#02101F; font-size:16px; font-weight:700; font-family:inherit; cursor:pointer}
  #login .err{color:var(--rose); font-size:14px; margin-top:14px; min-height:18px; max-width:320px}
  #login .login-card{width:100%; max-width:340px; display:flex; flex-direction:column; align-items:center; background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--line); border-radius:22px; padding:34px 26px 28px; box-shadow:0 20px 50px rgba(0,0,0,.35)}
  #login .login-mark{width:56px; height:56px; margin-bottom:14px; border-radius:16px; display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:26px; color:#02101F; background:linear-gradient(135deg,var(--cyan),var(--violet)); box-shadow:0 8px 22px rgba(56,189,248,.3)}
  #login .pass-wrap{position:relative; width:100%; max-width:300px}
  #login .pass-wrap input{padding-right:46px}
  #login .eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:auto; max-width:none; margin:0; padding:8px 10px; background:none; color:var(--muted); box-shadow:none; font-size:17px; cursor:pointer; opacity:.55}
  #login .remember{display:flex; align-items:center; justify-content:center; gap:8px; max-width:300px; margin:13px auto 2px; color:var(--muted); font-size:13.5px; cursor:pointer; user-select:none}
  #login .remember input{width:auto; max-width:none; padding:0; margin:0; accent-color:var(--cyan)}

  header{background:linear-gradient(135deg,var(--bg2),var(--bg)); border-bottom:1px solid var(--line); padding:22px 0 18px; transition:border-color .3s ease}
  header .wrap{display:flex; align-items:center; justify-content:space-between}
  .brand{font-weight:700; font-size:23px; letter-spacing:-.02em; background:linear-gradient(120deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent}
  .brand-tag{font-size:11px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:2px}
  .status{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted)}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

  nav{position:sticky; top:0; z-index:5; background:var(--bg2); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); transition:background-color .35s ease, border-color .3s ease}
  nav .wrap{display:flex; gap:4px; padding:8px 12px; overflow-x:auto; scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; padding:10px 14px; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); border-radius:10px; cursor:pointer; white-space:nowrap; transition:.2s}
  .tab.on{background:linear-gradient(120deg,var(--cyan),#2563EB); color:#02101F; box-shadow:0 3px 12px rgba(56,189,248,.3)}
  /* --- barra principal: 5 secciones repartidas parejo --- */
  nav .wrap{gap:6px; justify-content:space-between}
  .tab{flex:1 1 0; text-align:center; padding:11px 8px; font-size:13.5px}
  /* --- sub-pestañas dentro de una sección --- */
  .grupo{animation:fade .35s ease both}
  .subnav{display:flex; gap:5px; margin:2px 0 16px; background:var(--bg2); padding:5px; border-radius:13px; overflow-x:auto; scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subtab{flex:1 1 0; padding:9px 12px; border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); border-radius:9px; cursor:pointer; white-space:nowrap; transition:.2s}
  .subtab.on{background:var(--card); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.28)}

  main{padding-top:18px}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .stat{border-radius:16px; padding:16px; border:1px solid var(--line); background:linear-gradient(158deg,var(--card),var(--bg2)); position:relative; overflow:hidden; box-shadow:0 3px 14px rgba(0,0,0,.3); transition:transform .15s ease, border-color .3s ease}
  .stat:active{transform:scale(.98)}
  .stat .n{font-size:32px; font-weight:700; line-height:1}
  .stat .l{font-size:12.5px; color:var(--muted); margin-top:6px}
  .stat::after{content:""; position:absolute; right:-20px; top:-20px; width:72px; height:72px; border-radius:50%; opacity:.16}
  .s-cyan .n{color:var(--cyan)} .s-cyan::after{background:var(--cyan)}
  .s-violet .n{color:var(--violet)} .s-violet::after{background:var(--violet)}
  .s-amber .n{color:var(--amber)} .s-amber::after{background:var(--amber)}
  .s-green .n{color:var(--green)} .s-green::after{background:var(--green)}

  .money{background:linear-gradient(120deg,var(--card),var(--bg2)); border:1px solid var(--line); border-left:3px solid var(--cyan); border-radius:16px; padding:17px; margin-top:11px; display:flex; align-items:baseline; justify-content:space-between; box-shadow:0 3px 14px rgba(0,0,0,.22); transition:border-color .3s ease}
  .money .k{font-size:13px; color:var(--muted)}
  .money .v{font-family:"Fraunces"; font-weight:700; font-size:27px; color:var(--cyan)}

  .sec-h{display:flex; align-items:center; justify-content:space-between; margin:20px 2px 14px}
  .sec-h h2{font-size:14.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; position:relative; padding-left:13px; color:var(--ink)}
  .sec-h h2::before{content:""; position:absolute; left:0; top:52%; transform:translateY(-50%); width:4px; height:15px; border-radius:3px; background:linear-gradient(180deg,var(--cyan),var(--violet))}
  .add{border:none; background:linear-gradient(120deg,var(--amber),#F59E0B); color:#2A1B00; font-family:inherit; font-weight:700; font-size:13px; padding:10px 15px; border-radius:11px; cursor:pointer; box-shadow:0 3px 11px rgba(251,191,36,.26); transition:transform .12s ease, box-shadow .2s ease}
  .add:active{transform:scale(.96)}

  .searchbar{margin-bottom:12px}
  .searchbar input{width:100%; background:var(--card); border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:12px 14px; font-family:inherit; font-size:14.5px}
  .searchbar input::placeholder{color:var(--muted)}
  .searchbar input:focus{outline:none; border-color:var(--cyan)}
  .filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .filt{font-size:12px; font-weight:600; padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; transition:.15s}
  .filt.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

  .card{background:linear-gradient(180deg,var(--card),var(--bg2)); border:1px solid var(--line); border-radius:16px; padding:16px 17px; margin-bottom:11px; box-shadow:0 2px 10px rgba(0,0,0,.24); transition:transform .16s ease, border-color .2s ease, box-shadow .2s ease, background-color .35s ease}
  .card:active{transform:scale(.995)}
  @media(hover:hover){.card:hover{border-color:#2E4A72; box-shadow:0 7px 20px rgba(0,0,0,.32)}}
  .card.new{border-color:#5B4A1A; box-shadow:0 0 0 2px rgba(251,191,36,.16)}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .card .who{font-weight:600; font-size:15.5px}
  .card .prod{color:var(--cyan); font-size:13.5px; font-weight:500; margin-top:1px}
  .card .meta{color:var(--muted); font-size:13px; margin-top:9px; line-height:1.6}
  .total{font-weight:600; font-size:17px; white-space:nowrap; color:var(--amber)}

  .estado-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:12px}
  .est-btn{font-size:12px; font-weight:600; padding:7px 11px; border-radius:9px; border:1px solid var(--line); background:var(--bg2); color:var(--muted); cursor:pointer; transition:.15s}
  .est-btn.act{background:var(--green); color:#04231A; border-color:var(--green)}

  .prod-card{display:flex; justify-content:space-between; align-items:center; gap:12px}
  .prod-card .price{font-weight:600; font-size:17px; color:var(--amber)}
  .prod-card .desc{color:var(--muted); font-size:12.5px; margin-top:3px}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 10px; border-radius:20px; text-transform:capitalize}
  .b-ok{background:rgba(52,211,153,.16); color:var(--green)}
  .b-ver{background:rgba(251,191,36,.16); color:var(--amber)}
  .b-nuevo{background:rgba(56,189,248,.16); color:var(--cyan)}
  .b-otro{background:rgba(141,162,192,.16); color:var(--muted)}
  .card.ver{border-color:rgba(251,191,36,.5); box-shadow:0 0 0 2px rgba(251,191,36,.14)}
  .confirmar-btn{display:block; width:100%; margin-top:12px; padding:12px; border:none; border-radius:11px; background:linear-gradient(120deg,var(--green),#059669); color:#04231A; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer}
  .confirmar-btn:disabled{opacity:.6}
  .b-no{background:rgba(251,113,133,.16); color:var(--rose)}

  .empty{text-align:center; color:var(--muted); padding:38px 20px}
  .empty .big{font-family:"Fraunces"; font-size:19px; color:var(--ink); margin-bottom:6px}
  .loading{text-align:center; color:var(--muted); padding:34px; font-size:14px}
  .msg-err{background:rgba(251,113,133,.13); color:var(--rose); border-radius:12px; padding:12px 14px; font-size:13.5px; margin-bottom:10px; border:1px solid rgba(251,113,133,.28)}

  .intro{color:var(--muted); font-size:13.5px; line-height:1.6}
  #v-fer .intro{background:var(--card); border:1px solid var(--line); border-radius:15px; padding:15px 16px; color:var(--muted); font-size:13.5px; margin-bottom:14px}
  #v-fer .intro b{color:var(--ink)}
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--cyan); font-family:inherit; font-weight:600; font-size:12.5px; padding:9px 13px; border-radius:20px; cursor:pointer}
  #ferMsgs{display:flex; flex-direction:column; gap:10px; margin-bottom:14px}
  .bub{max-width:86%; padding:11px 14px; border-radius:16px; font-size:14.5px; line-height:1.55; white-space:pre-wrap; animation:fade .25s ease both}
  .bub.me{align-self:flex-end; background:linear-gradient(120deg,var(--cyan),#2563EB); color:#02101F; border-bottom-right-radius:5px}
  .bub.fer{align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:5px}
  .ferbar{display:flex; gap:8px}
  .ferbar input{flex:1; padding:13px 14px; border:1.5px solid var(--line); border-radius:13px; font-size:15px; font-family:inherit; background:var(--card); color:var(--ink)}
  .ferbar input::placeholder{color:var(--muted)}
  .ferbar input:focus{outline:none; border-color:var(--cyan)}
  .ferbar button{border:none; background:linear-gradient(120deg,var(--cyan),#2563EB); color:#02101F; font-family:inherit; font-weight:700; padding:0 18px; border-radius:13px; cursor:pointer}

  .modal-bg{position:fixed; inset:0; background:rgba(2,8,18,.7); display:none; align-items:flex-end; z-index:20}
  .modal-bg.show{display:flex}
  .modal{background:var(--bg2); width:100%; max-width:560px; margin:0 auto; border-radius:22px 22px 0 0; padding:22px 18px 30px; max-height:92vh; overflow:auto; border-top:1px solid var(--line); animation:fade .25s ease both}
  .modal h3{font-size:21px; margin-bottom:16px}
  .modal label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 5px}
  .modal input, .modal select{width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:12px; font-size:15px; font-family:inherit; background:var(--card); color:var(--ink)}
  .modal input::placeholder{color:var(--muted)}
  .modal input:focus,.modal select:focus{outline:none; border-color:var(--cyan)}
  .modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .modal .actions{display:flex; gap:10px; margin-top:22px}
  .modal .save{flex:1; padding:14px; border:none; border-radius:13px; background:linear-gradient(120deg,var(--cyan),#2563EB); color:#02101F; font-weight:700; font-size:15px; font-family:inherit; cursor:pointer}
  .modal .cancel{padding:14px 18px; border:1.5px solid var(--line); border-radius:13px; background:var(--card); color:var(--ink); font-weight:600; font-family:inherit; cursor:pointer}

  /* --- micro-interacciones (pulido, mismo estilo) --- */
  #login button, .confirmar-btn, .modal .save, .ferbar button{transition:transform .12s ease, box-shadow .2s ease; box-shadow:0 4px 14px rgba(0,0,0,.26)}
  #login button:active, .confirmar-btn:active, .modal .save:active, .ferbar button:active{transform:scale(.97)}
  .filt:active, .est-btn:active, .chip:active, .subtab:active{transform:scale(.95)}
  .stat:active{transform:scale(.98)}
  /* --- selector de temas (vista previa) --- */
  .tema-b{justify-content:flex-start !important; transition:transform .12s ease, border-color .2s ease}
  .tema-b:active{transform:scale(.96)}
  .tema-sw{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .tema-sw i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 5px currentColor}
  .tema-on{border-color:var(--cyan) !important; box-shadow:0 0 0 2px rgba(56,189,248,.28); color:var(--ink) !important}
  .tema-on::after{content:"✓"; margin-left:auto; color:var(--cyan); font-weight:700}
  /* --- catálogo ordenado --- */
  .catbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 2px 12px; color:var(--muted); font-size:13px}
  .pill-warn{background:rgba(251,191,36,.15); color:var(--amber); font-weight:600; font-size:12px; padding:3px 10px; border-radius:20px}
  .prod-acc{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
  .mini{flex:1 1 auto; font-size:12.5px; font-weight:600; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:var(--bg2); color:var(--ink); cursor:pointer; transition:transform .12s ease, border-color .2s ease, background .2s ease}
  .mini:active{transform:scale(.95)}
  .mini-del{flex:0 0 auto; color:var(--rose); border-color:transparent; background:rgba(251,113,133,.12); font-size:15px; padding:9px 13px}
  #toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--ink); color:var(--bg); font-weight:600; font-size:14px; padding:12px 18px; border-radius:13px; box-shadow:0 8px 26px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:60; max-width:88%; text-align:center}
  #toast.show{opacity:1; transform:translate(-50%,0)}
  .logout-btn{width:100%; margin-top:8px; padding:12px; border:1px solid var(--line); border-radius:12px; background:none; color:var(--rose); font-family:inherit; font-weight:600; font-size:14px; cursor:pointer; transition:transform .12s ease}
  .logout-btn:active{transform:scale(.97)}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-mark" id="loginMark">N</div>
    <div class="logo" id="marcaLogin">Novva</div>
    <div class="tag">Panel del negocio</div>
    <div class="pass-wrap">
      <input id="clave" type="password" placeholder="Tu clave" autocomplete="off" />
      <button type="button" id="verClave" class="eye" aria-label="Ver clave">👁</button>
    </div>
    <label class="remember"><input type="checkbox" id="recordar" /> Recordar en este celular</label>
    <button id="entrar">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header><div class="wrap">
    <div class="brand" id="marcaHeader">Novva</div>
    <div style="display:flex;align-items:center;gap:12px"><div class="status"><span class="dot"></span> Fer atendiendo</div><button id="cfgBtn" style="background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:0">⚙️</button></div>
  </div></header>

  <nav><div class="wrap">
    <button class="tab on" data-g="inicio">Inicio</button>
    <button class="tab" data-g="ventas">Ventas</button>
    <button class="tab" data-g="fer">Fer</button>
    <button class="tab" data-g="productos">Productos</button>
    <button class="tab" data-g="numeros">Números</button>
  </div></nav>

  <main class="wrap">
    <!-- INICIO -->
    <div class="grupo" id="g-inicio">
      <div class="subnav" id="sub-inicio"></div>
      <section id="v-pro"></section>
      <section id="v-acciones"></section>
      <div id="v-panorama">
        <section id="v-resumen"></section>
        <section id="v-dia" style="margin-top:10px"></section>
      </div>
      <section id="v-diagnostico" class="hidden"></section>
    </div>
    <!-- VENTAS -->
    <div class="grupo hidden" id="g-ventas">
      <div class="subnav" id="sub-ventas"></div>
      <section id="v-pedidos"></section>
      <section id="v-pendientes" class="hidden"></section>
      <section id="v-postventa" class="hidden"></section>
      <section id="v-buscar" class="hidden"></section>
    </div>
    <!-- FER -->
    <div class="grupo hidden" id="g-fer">
      <div class="subnav" id="sub-fer"></div>
      <section id="v-fer"></section>
      <section id="v-charlas" class="hidden"></section>
      <section id="v-analisis" class="hidden"></section>
    </div>
    <!-- PRODUCTOS -->
    <div class="grupo hidden" id="g-productos">
      <section id="v-catalogo"></section>
    </div>
    <!-- NÚMEROS -->
    <div class="grupo hidden" id="g-numeros">
      <div class="subnav" id="sub-numeros"></div>
      <section id="v-ganancia"></section>
      <section id="v-ventasmes" class="hidden"></section>
      <section id="v-seguimiento" class="hidden"></section>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalPedido">
  <div class="modal">
    <h3>Cargar venta a mano</h3>
    <div id="pErr" class="msg-err hidden"></div>
    <label>Producto</label><input id="p-producto" placeholder="Ej: Depiladora IPL" />
    <div class="row2">
      <div><label>Precio (Gs.)</label><input id="p-total" inputmode="numeric" placeholder="280.000" /></div>
      <div><label>Estado</label><select id="p-estado"><option>Nuevo</option><option>Confirmado</option><option>Enviado</option><option>Entregado</option></select></div>
    </div>
    <label>Nombre del cliente</label><input id="p-nombre" placeholder="Nombre y apellido" />
    <div class="row2">
      <div><label>Ciudad</label><input id="p-ciudad" placeholder="Ciudad" /></div>
      <div><label>Teléfono</label><input id="p-tel" inputmode="tel" placeholder="09xx xxxxxx" /></div>
    </div>
    <label>Dirección</label><input id="p-dir" placeholder="Dirección de entrega" />
    <div class="actions"><button class="cancel" data-close>Cancelar</button><button class="save" id="pSave">Guardar venta</button></div>
  </div>
</div>

<script>
const BACKEND = "https://guaranistorebot.onrender.com";
// 👇 CAMBIÁ ACÁ EL NOMBRE DE TU TIENDA (ej: "Lumé", "Selecta", "Prisma", "Novva")
// ---- Marca y Temas (configurables desde ⚙️) ----
let MARCA = "Novva";
try{ MARCA = localStorage.getItem("novva_marca") || MARCA; }catch(e){}
function aplicarMarca(){ document.getElementById("marcaLogin").textContent=MARCA; document.getElementById("marcaHeader").textContent=MARCA; document.title=MARCA+" · Panel"; var lm=document.getElementById("loginMark"); if(lm) lm.textContent=(MARCA||"N").trim().charAt(0).toUpperCase(); }
aplicarMarca();

const TEMAS = {
  "Aurora":{bg:"#0A0E1A",bg2:"#0F1424",card:"#151B30",line:"#262E48",ink:"#EDF0FA",muted:"#949DBB",cyan:"#4C8DFF",violet:"#9B7DFF",amber:"#E0A94A",green:"#34D399",rose:"#F58BB0"},
  "Empresarial":{bg:"#0A101C",bg2:"#0F1826",card:"#152238",line:"#28374F",ink:"#EAEEF6",muted:"#8A98AE",cyan:"#3B82F6",violet:"#6366F1",amber:"#C99A3B",green:"#2DAF7C",rose:"#DC6C8A"},
  "Noche":   {bg:"#0A1120",bg2:"#0E1728",card:"#132038",line:"#243B5C",ink:"#EAF1FB",muted:"#8DA2C0",cyan:"#38BDF8",violet:"#A78BFA",amber:"#FBBF24",green:"#34D399",rose:"#FB7185"},
  "Grafito": {bg:"#0D0F13",bg2:"#14171D",card:"#1B1F27",line:"#2C323D",ink:"#ECEEF3",muted:"#98A0AD",cyan:"#818CF8",violet:"#A78BFA",amber:"#FBBF24",green:"#34D399",rose:"#FB7185"},
  "Oceano":  {bg:"#06181C",bg2:"#0A2127",card:"#0F2B33",line:"#1E434B",ink:"#E6F5F6",muted:"#86AAB0",cyan:"#2DD4BF",violet:"#38BDF8",amber:"#FBBF24",green:"#34D399",rose:"#FB7185"},
  "Ciruela": {bg:"#120A1C",bg2:"#190F27",card:"#221635",line:"#3A2853",ink:"#EFE7FA",muted:"#A594C0",cyan:"#A78BFA",violet:"#C4B5FD",amber:"#FBBF24",green:"#34D399",rose:"#FB7185"},
  "Dia":     {bg:"#EDF1F8",bg2:"#FBFCFF",card:"#FFFFFF",line:"#D7DEEA",ink:"#1A2334",muted:"#5C6981",cyan:"#2563EB",violet:"#7C3AED",amber:"#B45309",green:"#047857",rose:"#E11D48"},
  "Perla":   {bg:"#F1F0EC",bg2:"#FCFCFA",card:"#FFFFFF",line:"#E2E0D8",ink:"#20242B",muted:"#5F6672",cyan:"#0D9488",violet:"#7C3AED",amber:"#B45309",green:"#047857",rose:"#E11D48"}
};
let TEMA_ACTUAL = "Empresarial";
function aplicarTema(nombre){
  if(!TEMAS[nombre]) nombre="Empresarial";
  const t=TEMAS[nombre]; const r=document.documentElement;
  for(const k in t){ r.style.setProperty("--"+k, t[k]); }
  TEMA_ACTUAL=nombre;
  try{ localStorage.setItem("novva_tema", nombre); }catch(e){}
}
try{ const g=localStorage.getItem("novva_tema"); aplicarTema(g&&TEMAS[g]?g:"Aurora"); }catch(e){ aplicarTema("Aurora"); }

function pintarTemas(){
  const cont=document.getElementById("temas");
  cont.innerHTML=Object.keys(TEMAS).map(function(n){ const t=TEMAS[n]; const on=(n===TEMA_ACTUAL);
    return '<button class="filt tema-b'+(on?' tema-on':'')+'" data-tema="'+n+'" style="display:flex;align-items:center;gap:9px;padding:10px 12px">'
      +'<span class="tema-sw" style="background:linear-gradient(135deg,'+t.bg2+' 0 50%,'+t.card+' 50% 100%);border:1px solid '+t.line+'"><i style="background:'+t.cyan+';color:'+t.cyan+'"></i></span>'
      +'<span>'+n+'</span></button>';
  }).join("");
  cont.querySelectorAll("[data-tema]").forEach(function(b){ b.onclick=function(){ aplicarTema(b.dataset.tema); pintarTemas(); }; });
}
document.getElementById("cfgBtn").onclick=function(){
  pintarTemas();
  document.getElementById("cfg-marca").value=MARCA;
  abrir("modalCfg");
};
document.getElementById("cfgSave").onclick=function(){
  const v=document.getElementById("cfg-marca").value.trim();
  if(v){ MARCA=v; aplicarMarca(); try{localStorage.setItem("novva_marca",MARCA);}catch(e){} }
  document.getElementById("modalCfg").classList.remove("show");
};
(function(){ var _cs=document.getElementById("cerrarSesion"); if(_cs) _cs.onclick=function(){
  try{localStorage.removeItem("novva_clave");}catch(e){}
  CLAVE="";
  var c=document.getElementById("clave"); if(c) c.value="";
  var rc=document.getElementById("recordar"); if(rc) rc.checked=false;
  document.getElementById("modalCfg").classList.remove("show");
  document.getElementById("app").classList.add("hidden");
  document.getElementById("login").classList.remove("hidden");
}; })();
let CLAVE = "";
let PEDIDOS = [];
let filtroEstado = "todos";
const ESTADOS = ["Nuevo","Confirmado","Enviado","Entregado","Cancelado"];
const FILTROS = [["todos","Todos"],["Nuevo","Nuevos"],["Pendiente de Verificación","Verificando"],["Pagado","Pagados"],["Enviado","Enviados"],["Entregado","Entregados"]];
const $ = s => document.querySelector(s);
const gs = v => { const n=String(v||"").replace(/[^\d]/g,""); return n ? "Gs. "+Number(n).toLocaleString("es-PY") : (v||"-"); };
const num = v => Number(String(v||"").replace(/[^\d]/g,""))||0;
const wait = ms => new Promise(r=>setTimeout(r,ms));

async function api(path, opts){
  opts = opts || {};
  const r = await fetch(BACKEND+path, Object.assign({}, opts, {headers:Object.assign({"Content-Type":"application/json","X-Clave":CLAVE}, opts.headers||{})}));
  if(r.status===401) throw new Error("401");
  return r.json();
}
function errBox(e){ if(e.message==="401"){ location.reload(); return ""; } return '<div class="msg-err">No pude traer los datos. Si el bot estaba dormido, esperá unos segundos y recargá.</div>'; }

// ---- LOGIN con reintento (Render se duerme en el plan gratis) ----
$("#entrar").onclick = entrar;
$("#clave").addEventListener("keydown", function(e){ if(e.key==="Enter") entrar(); });
$("#verClave").onclick = function(){ const i=$("#clave"); const ver=i.type==="password"; i.type=ver?"text":"password"; this.style.opacity=ver?"1":".55"; i.focus(); };
// Recordar clave en este celular (opcional): precarga y, si estaba guardada, entra solo.
try{ const ck=localStorage.getItem("novva_clave"); if(ck){ $("#clave").value=ck; $("#recordar").checked=true; setTimeout(entrar,150); } }catch(e){}
async function entrar(){
  CLAVE = $("#clave").value.trim();
  $("#loginErr").textContent="";
  if(!CLAVE){ $("#loginErr").textContent="Escribí tu clave"; return; }
  const btn=$("#entrar");
  for(let i=1;i<=4;i++){
    btn.textContent = i===1 ? "Entrando…" : "Despertando el servidor… ("+i+"/4)";
    try{
      const r = await fetch(BACKEND+"/api/panel/resumen", {headers:{"X-Clave":CLAVE}});
      if(r.status===401){ try{localStorage.removeItem("novva_clave");}catch(e){} $("#loginErr").textContent="Clave incorrecta"; btn.textContent="Entrar"; return; }
      if(r.status===404){ $("#loginErr").textContent="El panel todavía no está activo en el servidor. Esperá 1 minuto y probá de nuevo."; btn.textContent="Entrar"; return; }
      if(!r.ok){ throw new Error("http"); }
      try{ if($("#recordar")&&$("#recordar").checked){ localStorage.setItem("novva_clave",CLAVE); } else { localStorage.removeItem("novva_clave"); } }catch(e){}
      $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); abrirGrupo("inicio"); return;
    }catch(e){
      if(i<4){ await wait(4000); continue; }
      $("#loginErr").textContent="No pude conectar. Si recién prendiste el bot, esperá un momento y volvé a intentar.";
      btn.textContent="Entrar";
    }
  }
}

// ====== NAVEGACIÓN POR GRUPOS + SUB-PESTAÑAS ======
const GRUPOS = {
  inicio:    { views:["pro","acciones","panorama","diagnostico"], labels:["Resumen","Hoy","Panorama","Estado"] },
  ventas:    { views:["pedidos","pendientes","postventa","buscar"], labels:["Pedidos","Por cobrar","Post-venta","Buscar"] },
  fer:       { views:["fer","charlas","analisis"], labels:["Chat","Charlas","Análisis"] },
  productos: { views:["catalogo"] },
  numeros:   { views:["ganancia","ventasmes","seguimiento"], labels:["Ganancia","Por mes","Sin comprar"] }
};
const LOADERS = {
  pro:cargarPro, acciones:cargarAcciones, panorama:cargarPanorama, resumen:cargarResumen, dia:cargarDia, pedidos:cargarPedidos, pendientes:cargarPendientes,
  diagnostico:cargarDiagnostico,
  buscar:pintarBuscar, postventa:cargarPostventa, fer:pintarFer, charlas:cargarCharlas, analisis:cargarAnalisis,
  catalogo:cargarCatalogo, ganancia:pintarGanancia, ventasmes:cargarVentasMes, seguimiento:cargarSeguimiento
};
async function cargarPro(){
  const el=$("#v-pro"); if(!el) return;
  el.innerHTML='<div class="sec-h"><h2>Resumen ejecutivo</h2></div><div class="loading">Cargando\u2026</div>';
  try{
    const r=await Promise.all([
      api("/api/panel/ventas-mes").catch(function(){return {};}),
      api("/api/panel/ganancia").catch(function(){return {};}),
      api("/api/panel/pendientes-pago").catch(function(){return {};}),
      api("/api/panel/reporte-dia").catch(function(){return {};}),
      api("/api/panel/resumen").catch(function(){return {};})
    ]);
    const mes=r[0], gan=r[1], pend=r[2], dia=r[3], res=r[4];
    const meses=mes.meses||[];
    const ult=meses.length?meses[meses.length-1]:{mes:"",pedidos:0,facturado:0};
    const pendList=pend.pendientes||[];
    const porCobrar=pendList.reduce(function(a,p){return a+num(p.total);},0);
    el.innerHTML=
      '<div class="sec-h"><h2>Resumen ejecutivo</h2></div>'+
      '<div class="intro" style="margin-bottom:14px">Tu negocio de un vistazo'+(ult.mes?' \u00b7 '+ult.mes:'')+'.</div>'+
      '<div class="stats">'+
        '<div class="stat s-green"><div class="n num" style="font-size:21px">'+gs(ult.facturado||0)+'</div><div class="l">Facturado del mes</div></div>'+
        '<div class="stat s-cyan"><div class="n num">'+(ult.pedidos||0)+'</div><div class="l">Pedidos del mes</div></div>'+
        '<div class="stat s-violet"><div class="n num" style="font-size:21px">'+gs(gan.ganancia_total||0)+'</div><div class="l">Ganancia total</div></div>'+
        '<div class="stat s-amber"><div class="n num" style="font-size:21px">'+gs(porCobrar)+'</div><div class="l">Por cobrar ('+pendList.length+')</div></div>'+
      '</div>'+
      '<div class="money" style="margin-top:12px"><span class="k">Hoy</span><span class="v">'+(dia.cantidad||0)+' ped \u00b7 '+gs(dia.facturado||0)+'</span></div>'+
      '<div class="meta" style="margin-top:12px;text-align:center">Ventas totales hist\u00f3ricas: <b>'+(res.total||0)+'</b></div>';
  }catch(e){ const l=el.querySelector(".loading"); if(l) l.outerHTML=errBox(e); }
}
function mostrarVista(v){
  const s=$("#v-"+v); if(!s) return;
  s.classList.remove("hidden","fade"); void s.offsetWidth; s.classList.add("fade");
  if(LOADERS[v]) LOADERS[v]();
}
function abrirGrupo(g){
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x.dataset.g===g); });
  document.querySelectorAll(".grupo").forEach(function(x){ x.classList.add("hidden"); });
  $("#g-"+g).classList.remove("hidden");
  const conf=GRUPOS[g];
  conf.views.forEach(function(v){ const s=$("#v-"+v); if(s) s.classList.add("hidden"); });
  const sub=$("#sub-"+g);
  if(conf.views.length>1 && sub){
    sub.innerHTML=conf.views.map(function(v,i){ return '<button class="subtab'+(i===0?" on":"")+'" data-v="'+v+'">'+conf.labels[i]+'</button>'; }).join("");
    sub.querySelectorAll(".subtab").forEach(function(b){ b.onclick=function(){
      sub.querySelectorAll(".subtab").forEach(function(x){ x.classList.remove("on"); }); b.classList.add("on");
      conf.views.forEach(function(v){ const s=$("#v-"+v); if(s) s.classList.add("hidden"); });
      mostrarVista(b.dataset.v);
    };});
    mostrarVista(conf.views[0]);
  } else {
    mostrarVista(conf.views[0]);
  }
}
document.querySelectorAll(".tab").forEach(function(t){ t.onclick=function(){ abrirGrupo(t.dataset.g); }; });

function countUp(el){ const t=+el.dataset.v||0; let s=null; const dur=650;
  function step(ts){ if(!s)s=ts; const p=Math.min((ts-s)/dur,1); el.textContent=(el.dataset.pre||"")+Math.round(p*t); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

async function cargarResumen(){
  const el=$("#v-resumen"); el.innerHTML='<div class="loading">Cargando…</div>';
  try{
    const d = await api("/api/panel/resumen");
    let facturado = 0;
    try{ const pp=await api("/api/panel/pedidos"); (pp.pedidos||[]).forEach(function(p){ if(String(p.estado).toLowerCase()==="entregado") facturado+=num(p.total); }); }catch(e){}
    const alerta = (d.nuevos||0)>0;
    el.innerHTML =
      '<div class="stats">'+
        '<div class="stat s-cyan"><div class="n num" data-v="'+(d.total||0)+'">0</div><div class="l">Ventas totales</div></div>'+
        '<div class="stat s-violet"><div class="n num" data-v="'+(d.hoy||0)+'">0</div><div class="l">Ventas hoy</div></div>'+
        '<div class="stat s-amber"><div class="n num" data-v="'+(d.nuevos||0)+'" data-pre="'+(alerta?"🔔 ":"")+'">0</div><div class="l">Por despachar</div></div>'+
        '<div class="stat s-green"><div class="n num" data-v="'+(d.entregados||0)+'">0</div><div class="l">Entregados</div></div>'+
      '</div>'+
      '<div class="money"><span class="k">Facturado (entregados)</span><span class="v">'+gs(facturado)+'</span></div>'+
      '<div class="empty"><div class="big">Tu negocio, de un vistazo</div>'+(alerta?'Tenés pedidos nuevos esperando — miralos en Pedidos.':'Cargá tus ventas en Pedidos y las vas viendo acá.')+'</div>';
    document.querySelectorAll("#v-resumen .num").forEach(countUp);
    // aviso de stock (no rompe si falla)
    try{
      const s=await api("/api/panel/stock-alerta");
      if(s.hay_alerta){
        const ag=(s.agotados||[]);
        const bj=(s.stock_bajo||[]);
        let txt="";
        if(ag.length) txt+="Agotados: "+ag.join(", ")+". ";
        if(bj.length) txt+="Poco stock: "+bj.map(function(x){return x.producto+" ("+x.quedan+")";}).join(", ")+".";
        const aviso=document.createElement("div");
        aviso.className="card";
        aviso.style="border:1px solid var(--amber);background:var(--card)";
        aviso.innerHTML='<b style="color:var(--amber)">⚠️ Revisá el stock</b><div class="meta" style="margin-top:4px">'+txt+'</div>';
        el.prepend(aviso);
      }
    }catch(e){}
  }catch(e){ el.innerHTML=errBox(e); }
}

async function cargarPedidos(){
  const el=$("#v-pedidos");
  el.innerHTML='<div class="sec-h"><h2>Pedidos</h2><button class="add" id="btnAddP">+ Cargar venta</button></div>'+
    '<div class="searchbar"><input id="buscar" placeholder="Buscar cliente, ciudad o producto…" /></div>'+
    '<div class="filters" id="filtros"></div><div id="listaPed"><div class="loading">Cargando…</div></div>';
  $("#btnAddP").onclick=function(){abrir("modalPedido");};
  $("#filtros").innerHTML=FILTROS.map(function(f){return '<button class="filt '+(filtroEstado===f[0]?'on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>';}).join("");
  document.querySelectorAll(".filt").forEach(function(b){ b.onclick=function(){ filtroEstado=b.dataset.f; document.querySelectorAll(".filt").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); pintarLista(); }; });
  $("#buscar").addEventListener("input", pintarLista);
  try{ const d=await api("/api/panel/pedidos"); PEDIDOS=(d.pedidos||[]).filter(function(p){return p.nombre||p.producto||p.total;}); pintarLista(); }
  catch(e){ $("#listaPed").innerHTML=errBox(e); }
}
function pintarLista(){
  const q=($("#buscar")?$("#buscar").value:"").toLowerCase();
  let list=PEDIDOS.filter(function(p){
    const okF = filtroEstado==="todos" || String(p.estado).toLowerCase()===filtroEstado.toLowerCase();
    const okQ = !q || (p.nombre+" "+p.ciudad+" "+p.producto).toLowerCase().indexOf(q)>=0;
    return okF && okQ;
  });
  if(!list.length){ $("#listaPed").innerHTML='<div class="empty"><div class="big">Sin pedidos acá</div>Cargá una venta o cambiá el filtro.</div>'; return; }
  $("#listaPed").innerHTML=list.map(pedidoCard).join(""); bindEstados();
}
function pedidoCard(p){
  const est=String(p.estado).toLowerCase();
  const esNuevo=est==="nuevo";
  const verificando=est.indexOf("verific")>=0 || est.indexOf("pendiente")>=0;
  const botones=ESTADOS.map(function(e){return '<button class="est-btn '+(est===e.toLowerCase()?'act':'')+'" data-id="'+p.id+'" data-e="'+e+'">'+e+'</button>';}).join("");
  const badge='<span class="badge '+(est==="pagado"?"b-ok":(verificando?"b-ver":(esNuevo?"b-nuevo":"b-otro")))+'">'+(p.estado||"Nuevo")+'</span>';
  const btnPago=verificando ? '<button class="confirmar-btn" data-cid="'+p.id+'">✅ Confirmar Pago</button>' : '';
  return '<div class="card '+(esNuevo?'new':'')+(verificando?' ver':'')+'">'+
    '<div class="top"><div><div class="who">'+(p.nombre||"Sin nombre")+'</div><div class="prod">'+(p.producto||"—")+'</div></div><div class="total">'+gs(p.total)+'</div></div>'+
    '<div class="meta">📍 '+(p.ciudad||"-")+' · 📞 '+(p.telefono||"-")+'<br>'+(p.direccion?("🏠 "+p.direccion+"<br>"):"")+'🕒 '+(p.fecha||"-")+'</div>'+
    '<div style="margin-top:10px">'+badge+'</div>'+
    btnPago+
    '<div class="estado-row">'+botones+'</div></div>';
}
function bindEstados(){
  document.querySelectorAll(".est-btn").forEach(function(b){ b.onclick=async function(){
    if(!b.dataset.id) return; b.textContent="…";
    try{ const r=await api("/api/panel/estado",{method:"POST",body:JSON.stringify({id:b.dataset.id,estado:b.dataset.e})});
      if(r.ok){ const pp=PEDIDOS.find(function(x){return x.id===b.dataset.id;}); if(pp) pp.estado=b.dataset.e; pintarLista(); } else alert("No se pudo: "+(r.error||"")); }
    catch(e){ alert("Error de conexión"); }
  };});
  document.querySelectorAll(".confirmar-btn").forEach(function(b){ b.onclick=async function(){
    b.textContent="Confirmando…"; b.disabled=true;
    try{ const r=await api("/api/panel/aprobar-pedido",{method:"POST",body:JSON.stringify({id:b.dataset.cid})});
      if(r.ok){ const pp=PEDIDOS.find(function(x){return x.id===b.dataset.cid;}); if(pp) pp.estado="Pagado"; pintarLista(); } else { alert("No se pudo confirmar: "+(r.error||"")); b.textContent="✅ Confirmar Pago"; b.disabled=false; } }
    catch(e){ alert("Error de conexión"); b.textContent="✅ Confirmar Pago"; b.disabled=false; }
  };});
}

let CAT_LISTA=[], CAT_Q="", EDIT_ID=null;
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
async function cargarCatalogo(){
  const el=$("#v-catalogo");
  el.innerHTML='<div class="sec-h"><h2>Cat\u00e1logo</h2><button class="add" id="btnAddPr">+ Producto</button></div><div class="loading">Cargando\u2026</div>';
  const a0=$("#btnAddPr"); if(a0) a0.onclick=abrirNuevoProducto;
  try{
    const d=await api("/api/panel/catalogo"); CAT_LISTA=d.productos||[];
    const total=CAT_LISTA.length;
    const agotados=CAT_LISTA.filter(function(x){return String(x.stock).toLowerCase().indexOf("agotad")>=0;}).length;
    const sinCosto=CAT_LISTA.filter(function(x){return num(x.costo)<=0;}).length;
    let h='<div class="sec-h"><h2>Cat\u00e1logo</h2><button class="add" id="btnAddPr">+ Producto</button></div>';
    h+='<div class="catbar"><span>'+total+' producto'+(total===1?'':'s')+'</span>';
    if(agotados) h+='<span class="pill-warn">'+agotados+' agotado'+(agotados===1?'':'s')+'</span>';
    if(sinCosto) h+='<span class="pill-warn">'+sinCosto+' sin costo</span>';
    h+='</div><div class="searchbar"><input id="catBuscar" placeholder="Buscar producto\u2026" /></div><div id="catCards"></div>';

function pintarCards(){

  const list=q? CAT_LISTA.filter(function(p){return (String(p.nombre||"")+" "+String(p.descripcion||"")).toLowerCase().indexOf(q)>=0;}) : CAT_LISTA;
  if(!CAT_LISTA.length){ cont.innerHTML='<div class="empty"><div class="big">Cat\u00e1logo vac\u00edo</div>Agreg\u00e1 tu primer producto con \u201c+ Producto\u201d.</div>'; return; }
  if(!list.length){ cont.innerHTML='<div class="empty">Nada coincide con la b\u00fasqueda.</div>'; return; }
  cont.innerHTML=list.map(function(p){
    const ok=String(p.stock).toLowerCase().indexOf("agotad")<0;
    const costo=num(p.costo); const gan=num(p.precio)-costo;
    const costoLinea = costo>0
      ? '<div class="meta" style="margin-top:6px">Costo: '+gs(costo)+' \u00b7 Gan\u00e1s: <b style="color:var(--green)">'+gs(gan)+'</b></div>'
      : '<div class="meta" style="margin-top:6px;color:var(--amber)">\u26a0\ufe0f Sin costo cargado</div>';
    return '<div class="card" style="flex-direction:column;align-items:stretch">'
      +'<div style="display:flex;justify-content:space-between;gap:10px">'
        +'<div style="min-width:0"><div class="who">'+esc(p.nombre||"Producto")+'</div><div class="desc">'+esc(p.descripcion||"")+'</div>'
        +'<div style="margin-top:7px"><span class="badge '+(ok?'b-ok':'b-no')+'">'+esc(p.stock||"sin estado")+'</span></div></div>'
        +'<div class="price">'+gs(p.precio)+'</div>'
      +'</div>'+costoLinea
      +'<div class="prod-acc">'
        +'<button class="mini" data-ed="'+p.id+'">\u270e Editar</button>'
        +'<button class="mini" data-costo="'+p.id+'" data-nom="'+esc(p.nombre||"")+'">'+(costo>0?"Costo":"Cargar costo")+'</button>'
        +'<button class="mini" data-tog="'+p.id+'" data-st="'+(ok?"agotado":"disponible")+'">'+(ok?"Marcar agotado":"Marcar disponible")+'</button>'
        +'<button class="mini mini-del" data-del="'+p.id+'" data-nom="'+esc(p.nombre||"")+'" title="Borrar">\ud83d\uddd1</button>'
      +'</div></div>';
  }).join("");
  cont.querySelectorAll("[data-ed]").forEach(function(b){ b.onclick=function(){ const p=CAT_LISTA.find(function(x){return x.id===b.dataset.ed;}); if(p) abrirEditarProducto(p); }; });
  cont.querySelectorAll("[data-costo]").forEach(function(b){ b.onclick=function(){ editarCosto(b.dataset.costo, b.dataset.nom); }; });
  cont.querySelectorAll("[data-tog]").forEach(function(b){ b.onclick=function(){ toggleStock(b.dataset.tog, b.dataset.st); }; });
  cont.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){ borrarProducto(b.dataset.del, b.dataset.nom); }; });
}
function abrirNuevoProducto(){
  EDIT_ID=null;
  const t=$("#prTitle"); if(t) t.textContent="Nuevo producto";
  ["pr-nombre","pr-precio","pr-desc"].forEach(function(id){ const e=$("#"+id); if(e) e.value=""; });
  const st=$("#pr-stock"); if(st) st.value="disponible";

}
function abrirEditarProducto(p){
  EDIT_ID=p.id;
  const t=$("#prTitle"); if(t) t.textContent="Editar producto";
  $("#pr-nombre").value=p.nombre||"";
  $("#pr-precio").value=String(p.precio||"").replace(/[^\d]/g,"");
  $("#pr-desc").value=p.descripcion||"";

async function toggleStock(id, nuevo){
  try{
    const r=await api("/api/panel/editar-producto",{method:"PATCH",body:JSON.stringify({id:id,stock:nuevo})});
    if(r.ok){ toast(nuevo==="agotado"?"Marcado como agotado":"Marcado como disponible"); cargarCatalogo(); }
    else toast("No se pudo: "+(r.error||"error"));
  }catch(e){ toast("Error de conexi\u00f3n"); }
}
async function borrarProducto(id, nombre){
  if(!confirm("\u00bfBorrar \""+(nombre||"este producto")+"\" del cat\u00e1logo? No se puede deshacer.")) return;
  try{
    const r=await api("/api/panel/producto",{method:"DELETE",body:JSON.stringify({id:id})});
    if(r.ok){ toast("Producto borrado"); cargarCatalogo(); }
    else toast("No se pudo borrar: "+(r.error||"error"));
  }catch(e){ toast("Error de conexi\u00f3n"); }
}
async function editarCosto(id, nombre){
  const v=prompt("\u00bfCu\u00e1nto te cuesta a vos "+nombre+"? (solo el n\u00famero, sin puntos)");
  if(v===null) return;
  const costo=num(v);
  try{
    const r=await api("/api/panel/editar-costo",{method:"POST",body:JSON.stringify({id:id,costo:costo})});
    if(r.ok){ ganPintado=false; toast("Costo guardado"); cargarCatalogo(); }
    else toast("No se pudo guardar: "+(r.error||"revis\u00e1 la columna costo_gs"));
  }catch(e){ toast("Error de conexi\u00f3n"); }
}
function toast(msg){
  let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window._toastT); window._toastT=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

function campoG(id,label,ph){ return '<label style="display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px">'+label+'</label><input id="'+id+'" inputmode="numeric" placeholder="'+ph+'" style="width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit">'; }
function calcGanancia(){
  const venta=num($("#gVenta").value), costo=num($("#gCosto").value), envio=num($("#gEnvio").value), pub=num($("#gPub").value), otros=num($("#gOtros").value);
  const gan=venta-(costo+envio+pub+otros); const margen=venta>0?(gan/venta*100):0;
  const R=$("#gResultado"); R.textContent=gs(gan); R.style.color = gan>=0 ? "var(--green)" : "var(--rose)";
  $("#gMargen").textContent = venta>0 ? ("Margen: "+margen.toFixed(0)+"%") : "Margen: —";
  $("#gDetalle").innerHTML=
    filaG("Venta",venta,false)+filaG("− Costo producto",costo,true)+filaG("− Envío",envio,true)+filaG("− Publicidad",pub,true)+filaG("− Otros",otros,true);
  if(venta>0){ $("#gTip").textContent = gan<0
    ? "⚠️ Con estos números perdés plata en cada venta. Subí el precio o bajá costos/publicidad."
    : (margen<20 ? "El margen está finito: si la publicidad sube un poco, te quedás sin ganancia. Ojo."
                 : "👍 Buen margen. Este producto sí te deja plata — candidato a meterle más publicidad."); }
}
function filaG(t,v,neg){ return '<div style="display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--muted)"><span>'+t+'</span><b style="color:'+(neg?'var(--rose)':'var(--ink)')+';font-family:Fraunces,serif">'+gs(v)+'</b></div>'; }

      box.innerHTML='<div class="loading">Buscando…</div>';
      try{
        const d=await api("/api/panel/buscar?q="+encodeURIComponent(q));
        const r=d.resultados||[];
        if(!r.length){ box.innerHTML='<div class="empty">Nada encontrado con "'+q+'".</div>'; return; }
        box.innerHTML=r.map(function(p){
          return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
            '<div><b style="font-family:Fraunces,serif">'+(p.nombre||"-")+'</b><div class="meta">'+(p.producto||"-")+' · '+(p.ciudad||"-")+' · '+(p.telefono||"-")+'</div></div>'+
            '<div style="text-align:right"><b style="font-family:Fraunces,serif">'+gs(p.total)+'</b><div class="meta">'+(p.estado||"Nuevo")+'</div></div>'+
          '</div></div>'; }).join("");
      }catch(e){ box.innerHTML=errBox(e); }
    }, 350);
  });
}


// ============ FER: análisis de charlas muertas ============
async function cargarAnalisis(){
  const el=$("#v-analisis");
  el.innerHTML='<div class="sec-h"><h2>Análisis de charlas</h2></div><div class="intro" style="margin-bottom:14px">Fer mira las charlas que no terminaron en compra y te dice dónde se caen las ventas.</div><div class="loading">Fer está analizando…</div>';
  try{
    const d=await api("/api/panel/analisis-charlas");
    el.querySelector(".loading").outerHTML='<div class="card"><div style="white-space:pre-wrap;line-height:1.65;font-size:14.5px">'+(d.analisis||"Sin datos por ahora.")+'</div>'+(d.charlas_analizadas?'<div class="meta" style="margin-top:10px">Basado en '+d.charlas_analizadas+' charlas sin venta.</div>':'')+'</div>';
  }catch(e){ el.querySelector(".loading").outerHTML=errBox(e); }
}

// ============ NÚMEROS: ventas por mes (con barras) ============
async function cargarVentasMes(){
  const el=$("#v-ventasmes");
  el.innerHTML='<div class="sec-h"><h2>Ventas por mes</h2></div><div class="loading">Cargando…</div>';
  try{
    const d=await api("/api/panel/ventas-mes");
    const m=d.meses||[];
    if(!m.length){ el.querySelector(".loading").outerHTML='<div class="empty"><div class="big">Sin datos todavía</div>Cuando tengas ventas en varios meses vas a ver acá cómo crece el negocio.</div>'; return; }
    const max=Math.max.apply(null, m.map(function(x){return x.facturado||0;}))||1;
    el.querySelector(".loading").outerHTML=m.map(function(x){
      const pct=Math.max(4, Math.round((x.facturado/max)*100));
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-family:Fraunces,serif;font-size:16px">'+x.mes+'</b><span class="meta">'+x.pedidos+(x.pedidos===1?" pedido":" pedidos")+'</span></div>'+
        '<div style="height:9px;background:var(--bg);border-radius:6px;margin:9px 0 7px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--cyan),var(--violet));border-radius:6px"></div></div>'+
        '<b style="font-family:Fraunces,serif;color:var(--green);font-size:17px">'+gs(x.facturado)+'</b></div>';
    }).join("");
  }catch(e){ el.querySelector(".loading").outerHTML=errBox(e); }
}


// ============ VENTAS: post-venta (mensajes listos para copiar) ============
let POSTV=[];
async function cargarPostventa(){
  const el=$("#v-postventa");
  el.innerHTML='<div class="sec-h"><h2>Post-venta</h2></div><div class="intro" style="margin-bottom:14px">Elegí un pedido y Fer te arma el mensaje. Lo copiás y se lo mandás por Messenger vos mismo. 💬</div><div class="loading">Cargando…</div>';
  try{
    const d=await api("/api/panel/pedidos");
    POSTV=(d.pedidos||[]).filter(function(p){ return p.nombre||p.producto; });
    if(!POSTV.length){ el.querySelector(".loading").outerHTML='<div class="empty"><div class="big">Sin pedidos todavía</div>Cuando tengas ventas, acá vas a poder mandarles seguimiento.</div>'; return; }
    el.querySelector(".loading").outerHTML=POSTV.map(function(p,i){
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div><b style="font-family:Fraunces,serif">'+(p.nombre||"-")+'</b><div class="meta">'+(p.producto||"-")+' · '+(p.estado||"Nuevo")+'</div></div></div>'+
        '<div class="pv-btns" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px">'+
          pvBtn(i,"camino","🚚 Va en camino")+
          pvBtn(i,"llego","📦 ¿Te llegó?")+
          pvBtn(i,"testimonio","⭐ Pedir foto")+
          pvBtn(i,"recompra","🔁 Recompra")+
        '</div>'+
        '<div class="pv-out" id="pv-out-'+i+'" style="margin-top:10px"></div></div>';
    }).join("");
    el.querySelectorAll(".pv-btns button").forEach(function(b){
      b.onclick=function(){ pvGenerar(+b.dataset.i, b.dataset.tipo, b); };
    });
  }catch(e){ el.querySelector(".loading").outerHTML=errBox(e); }
}
function pvBtn(i,tipo,label){
  return '<button class="pv-b" data-i="'+i+'" data-tipo="'+tipo+'" style="flex:1 1 44%;padding:10px 8px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer">'+label+'</button>';
}
async function pvGenerar(i,tipo,btn){
  const p=POSTV[i]; const out=$("#pv-out-"+i);
  const txtOrig=btn.textContent; btn.textContent="Pensando…"; btn.disabled=true;
  try{
    const r=await api("/api/panel/postventa-mensaje",{method:"POST",body:JSON.stringify({tipo:tipo,nombre:p.nombre,producto:p.producto})});
    const msg=r.mensaje||"(sin respuesta)";
    out.innerHTML='<div class="bub fer" style="max-width:100%;margin:0 0 8px">'+msg+'</div>'+
      '<button class="pv-copy" style="width:100%;padding:11px;border:none;border-radius:11px;background:linear-gradient(120deg,var(--cyan),#2563EB);color:#02101F;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer">📋 Copiar mensaje</button>';
    const cbtn=out.querySelector(".pv-copy");
    cbtn.onclick=function(){
      navigator.clipboard.writeText(msg).then(function(){ cbtn.textContent="✅ ¡Copiado!"; setTimeout(function(){cbtn.textContent="📋 Copiar mensaje";},1500); })
      .catch(function(){ cbtn.textContent="Seleccioná y copiá arriba"; });
    };
  }catch(e){ out.innerHTML='<div class="msg-err">No pude generar el mensaje. Probá de nuevo.</div>'; }
  finally{ btn.textContent=txtOrig; btn.disabled=false; }
}


// ============ INICIO: panorama (resumen + hoy juntos) ============
function cargarPanorama(){
  $("#v-panorama").classList.remove("hidden");
  $("#v-resumen").classList.remove("hidden");
  $("#v-dia").classList.remove("hidden");
  cargarResumen(); cargarDia();
}

// ============ INICIO: diagnóstico del sistema ============
async function cargarDiagnostico(){
  // mostrar el contenedor de diagnóstico y ocultar el panorama
  $("#v-panorama").classList.add("hidden");
  const el=$("#v-diagnostico");
  el.innerHTML='<div class="sec-h"><h2>Estado del sistema</h2></div><div class="intro" style="margin-bottom:14px">Chequeo de que todas las piezas del bot estén funcionando.</div><div class="loading">Revisando…</div>';
  try{
    const d=await api("/api/panel/diagnostico");
    const checks=d.checks||[];
    const okAll=d.salud==="todo_ok";
    let html='<div class="card" style="border:1px solid '+(okAll?"var(--green)":"var(--amber)")+';text-align:center">'+
      '<div style="font-size:34px">'+(okAll?"✅":"⚠️")+'</div>'+
      '<b style="font-family:Fraunces,serif;font-size:19px;color:'+(okAll?"var(--green)":"var(--amber)")+'">'+(okAll?"Todo funcionando":(d.fallas+" cosa(s) para revisar"))+'</b></div>';
    html+=checks.map(function(c){
      const ok=c.estado==="ok";
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'+
        '<div><b style="font-family:Fraunces,serif">'+(ok?"✅ ":"⚠️ ")+c.nombre+'</b><div class="meta" style="margin-top:4px;color:'+(ok?"var(--muted)":"var(--amber)")+'">'+c.detalle+'</div></div></div></div>';
    }).join("");
    html+='<button id="diagAvisar" style="width:100%;margin-top:6px;padding:13px;border:none;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer">📲 Enviarme el estado por Telegram</button>';
    el.innerHTML=html;
    $("#diagAvisar").onclick=async function(){
      this.textContent="Enviando…"; this.disabled=true;
      try{ await api("/api/panel/diagnostico?avisar=1"); this.textContent="✅ Enviado a Telegram"; }
      catch(e){ this.textContent="No se pudo enviar"; }
    };
  }catch(e){ el.querySelector(".loading").outerHTML=errBox(e); }
}


// ============ INICIO: "Hoy hacé esto" (acciones) ============
function irA(g, v){
  abrirGrupo(g);
  if(v){ const sub=$("#sub-"+g); if(sub){ const b=sub.querySelector('[data-v="'+v+'"]'); if(b) b.click(); } }
  window.scrollTo({top:0, behavior:"smooth"});
}
async function cargarAcciones(){
  $("#v-panorama").classList.add("hidden");
  const el=$("#v-acciones");
  el.innerHTML='<div class="sec-h"><h2>Hoy hacé esto</h2></div><div class="loading">Revisando tu negocio…</div>';
  try{
    const d=await api("/api/panel/acciones");
    const acc=d.acciones||[];
    if(!acc.length){
      el.innerHTML='<div class="sec-h"><h2>Hoy hacé esto</h2></div><div class="empty"><div class="big">Todo al día 🎉</div>No hay nada urgente. Buen momento para escalar los ads o traer clientes nuevos.</div>';
      return;
    }
    const colores={1:"var(--rose)",2:"var(--amber)",3:"var(--cyan)"};
    let html='<div class="sec-h"><h2>Hoy hacé esto</h2></div>'+
      '<div class="intro" style="margin-bottom:14px">'+acc.length+' cosa(s) que mueven plata. Empezá por arriba, que es lo más urgente. 💪</div>';
    html+=acc.map(function(a,i){
      const col=colores[a.prioridad]||"var(--cyan)";
      return '<div class="card" style="border-left:3px solid '+col+'">'+
        '<div style="display:flex;gap:11px;align-items:flex-start">'+
          '<div style="font-size:22px;line-height:1">'+a.icono+'</div>'+
          '<div style="flex:1"><b style="font-family:Fraunces,serif;font-size:16px">'+a.titulo+'</b>'+
          '<div class="meta" style="margin-top:4px">'+a.detalle+'</div>'+
          '<button class="acc-btn" data-g="'+a.grupo+'" data-v="'+(a.sub||"")+'" style="margin-top:11px;padding:9px 15px;border:none;border-radius:10px;background:linear-gradient(120deg,var(--cyan),#2563EB);color:#02101F;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer">'+a.boton+' →</button>'+
          '</div></div></div>';
    }).join("");
    el.innerHTML=html;
    el.querySelectorAll(".acc-btn").forEach(function(b){
      b.onclick=function(){ irA(b.dataset.g, b.dataset.v); };
    });
  }catch(e){ el.innerHTML='<div class="sec-h"><h2>Hoy hacé esto</h2></div>'+errBox(e); }
}

function merr(id,t){ const e=$("#"+id); e.textContent=t; e.classList.remove("hidden"); }
</script>
